# Brief: Serves the DASH ladder. no-store keeps the player on the network when the video loops,
# so link degradation always shows; CORS lets other players (pyDash, test pages) fetch it
server {
    listen 80;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    location ~ \.mpd$ { default_type application/dash+xml; }
    location ~ \.m4s$ { default_type video/iso.segment; }
}
